<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NetPetz - Virtual Pet Adventure MMO</title>
<style>
:root {
  --dark: #1a1a2e;
  --red: #e94560;
  --gold: #f4c542;
  --blue: #0f3460;
  --purple: #533483;
  --green: #2ecc71;
  --white: #ecf0f1;
  --gray: #7f8c8d;
  --orange: #e67e22;
  --magenta: #9b59b6;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: var(--dark);
  color: var(--white);
  font-family: 'Courier New', monospace;
  overflow: hidden;
  width: 100vw;
  height: 100vh;
}
#game-container {
  position: relative;
  width: 1024px;
  height: 768px;
  margin: 0 auto;
  background: #0a0a1a;
  border: 2px solid var(--purple);
  overflow: hidden;
}
canvas { display: block; }
#pixi-canvas {
  position: absolute;
  top: 0;
  left: 0;
  z-index: 1;
}
#ui-layer {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 10;
  pointer-events: none;
}
#ui-layer > * { pointer-events: auto; }
.panel {
  position: absolute;
  background: rgba(26,26,46,0.95);
  border: 2px solid var(--purple);
  border-radius: 8px;
  padding: 12px;
  color: var(--white);
  display: none;
}
.panel.active { display: block; }
.panel h2 {
  color: var(--gold);
  font-size: 18px;
  margin-bottom: 8px;
  text-transform: uppercase;
  letter-spacing: 2px;
  border-bottom: 1px solid var(--purple);
  padding-bottom: 4px;
}
.panel h3 {
  color: var(--orange);
  font-size: 14px;
  margin: 6px 0 4px;
}
.btn {
  background: var(--blue);
  color: var(--white);
  border: 1px solid var(--purple);
  padding: 6px 14px;
  cursor: pointer;
  font-family: 'Courier New', monospace;
  font-size: 12px;
  border-radius: 4px;
  transition: all 0.2s;
  margin: 2px;
}
.btn:hover { background: var(--purple); border-color: var(--gold); }
.btn.small { padding: 3px 8px; font-size: 10px; }
.btn.danger { background: var(--red); }
.btn.gold { background: var(--gold); color: var(--dark); }
.btn.green { background: var(--green); color: var(--dark); }
input, select {
  background: rgba(15,52,96,0.8);
  color: var(--white);
  border: 1px solid var(--purple);
  padding: 6px 8px;
  font-family: 'Courier New', monospace;
  font-size: 12px;
  border-radius: 4px;
  margin: 2px;
  width: 180px;
}
.stat-bar {
  height: 14px;
  background: rgba(0,0,0,0.5);
  border: 1px solid var(--gray);
  border-radius: 3px;
  margin: 2px 0;
  overflow: hidden;
}
.stat-fill {
  height: 100%;
  transition: width 0.5s;
  border-radius: 2px;
}
.stat-label {
  font-size: 10px;
  color: var(--gray);
  display: flex;
  justify-content: space-between;
}
.scroll-area {
  overflow-y: auto;
  max-height: 300px;
  padding-right: 4px;
}
.scroll-area::-webkit-scrollbar { width: 6px; }
.scroll-area::-webkit-scrollbar-thumb { background: var(--purple); border-radius: 3px; }
.notification {
  position: absolute;
  top: 60px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.85);
  border: 1px solid var(--gold);
  padding: 8px 16px;
  border-radius: 4px;
  font-size: 12px;
  z-index: 100;
  animation: fadeInOut 3s forwards;
}
@keyframes fadeInOut {
  0% { opacity:0; transform:translateX(-50%) translateY(-10px); }
  10% { opacity:1; transform:translateX(-50%) translateY(0); }
  80% { opacity:1; }
  100% { opacity:0; }
}
#login-screen {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: linear-gradient(135deg, var(--dark), var(--blue));
  z-index: 200;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
#login-screen.hidden { display: none; }
#login-screen h1 {
  font-size: 48px;
  color: var(--gold);
  text-shadow: 0 0 20px var(--gold);
  margin-bottom: 8px;
  letter-spacing: 4px;
}
#login-screen .subtitle {
  color: var(--gray);
  margin-bottom: 20px;
  font-size: 14px;
}
#login-form {
  background: rgba(0,0,0,0.4);
  padding: 20px;
  border-radius: 8px;
  border: 1px solid var(--purple);
  width: 320px;
}
#login-form input { width: 100%; margin: 4px 0; }
#login-form .btn { width: 100%; margin-top: 8px; }
#top-bar {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 32px;
  background: rgba(26,26,46,0.9);
  border-bottom: 1px solid var(--purple);
  display: flex;
  align-items: center;
  padding: 0 8px;
  z-index: 50;
  gap: 4px;
  font-size: 11px;
}
#top-bar .currency {
  color: var(--gold);
  margin-right: 12px;
}
#top-bar .divider { color: var(--gray); margin: 0 4px; }
#chat-box {
  position: absolute;
  bottom: 4px;
  left: 4px;
  width: 400px;
  height: 120px;
  background: rgba(0,0,0,0.7);
  border: 1px solid var(--purple);
  border-radius: 4px;
  font-size: 10px;
  z-index: 20;
  display: flex;
  flex-direction: column;
}
#chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 4px;
}
#chat-input-row {
  display: flex;
  border-top: 1px solid var(--purple);
}
#chat-input {
  flex: 1;
  background: transparent;
  border: none;
  color: var(--white);
  padding: 4px;
  font-size: 10px;
  font-family: 'Courier New', monospace;
}
#side-panel {
  position: absolute;
  right: 4px;
  top: 36px;
  width: 220px;
  max-height: 600px;
  overflow-y: auto;
  z-index: 20;
}
#pet-stats-panel {
  position: absolute;
  left: 4px;
  top: 36px;
  width: 200px;
  z-index: 20;
  background: rgba(26,26,46,0.9);
  border: 1px solid var(--purple);
  border-radius: 8px;
  padding: 8px;
  font-size: 10px;
}
#action-bar {
  position: absolute;
  bottom: 4px;
  right: 4px;
  z-index: 20;
  display: flex;
  flex-wrap: wrap;
  gap: 3px;
  max-width: 600px;
  justify-content: flex-end;
}
.modal-overlay {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.7);
  z-index: 150;
  display: none;
  align-items: center;
  justify-content: center;
}
.modal-overlay.active { display: flex; }
.modal {
  background: var(--dark);
  border: 2px solid var(--purple);
  border-radius: 8px;
  padding: 16px;
  max-width: 600px;
  max-height: 500px;
  overflow-y: auto;
  color: var(--white);
  font-size: 12px;
}
.tab-row {
  display: flex;
  gap: 2px;
  margin-bottom: 8px;
}
.tab {
  background: rgba(15,52,96,0.5);
  color: var(--white);
  border: 1px solid var(--purple);
  padding: 4px 10px;
  cursor: pointer;
  font-size: 10px;
  border-radius: 4px 4px 0 0;
}
.tab.active { background: var(--purple); border-color: var(--gold); }
.item-slot {
  display: inline-block;
  width: 48px;
  height: 48px;
  background: rgba(0,0,0,0.4);
  border: 1px solid var(--gray);
  margin: 2px;
  vertical-align: top;
  cursor: pointer;
  border-radius: 4px;
  text-align: center;
  font-size: 9px;
  padding: 2px;
  position: relative;
}
.item-slot:hover { border-color: var(--gold); }
.item-slot .qty {
  position: absolute;
  bottom: 2px;
  right: 3px;
  color: var(--white);
  font-size: 9px;
}
</style>
</head>

// ---- Web Audio SFX ----
const SFX = {
  ctx: null,
  init() {
    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  },
  play(freq, type, dur, vol) {
    if (!this.ctx) return;
    try {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = type || 'square';
      osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
      gain.gain.setValueAtTime((vol||0.1), this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + (dur||0.15));
      osc.connect(gain); gain.connect(this.ctx.destination);
      osc.start(); osc.stop(this.ctx.currentTime + (dur||0.15));
    } catch(e) {}
  },
  blip() { this.play(880, 'square', 0.08, 0.08); },
  click() { this.play(660, 'square', 0.05, 0.06); },
  coin() { this.play(1318, 'square', 0.1, 0.1); this.play(1760, 'square', 0.08, 0.08); },
  levelUp() { this.play(523, 'triangle', 0.1, 0.1); this.play(659, 'triangle', 0.1, 0.1); this.play(784, 'triangle', 0.15, 0.12); },
  damage() { this.play(150, 'sawtooth', 0.2, 0.15); },
  heal() { this.play(400, 'sine', 0.15, 0.1); this.play(600, 'sine', 0.15, 0.1); },
  buy() { this.play(1000, 'triangle', 0.08, 0.08); this.play(1200, 'triangle', 0.08, 0.08); },
  error() { this.play(200, 'square', 0.2, 0.12); },
  quest() { this.play(440, 'triangle', 0.15, 0.1); this.play(554, 'triangle', 0.15, 0.1); this.play(659, 'triangle', 0.2, 0.12); },
  victory() { 
    [523,659,784,1047].forEach((f,i) => setTimeout(() => this.play(f,'triangle',0.2,0.1), i*100));
  },
  evolve() {
    [262,330,392,523].forEach((f,i) => setTimeout(() => this.play(f,'sine',0.25,0.12), i*120));
  },
  rain() { this.play(200 + Math.random()*100, 'triangle', 0.08, 0.04); }
};

// ---- Notification System ----
function notify(msg, duration) {
  const area = document.getElementById('notification-area');
  const div = document.createElement('div');
  div.className = 'notification';
  div.textContent = msg;
  div.style.animationDuration = (duration || 3) + 's';
  area.appendChild(div);
  setTimeout(() => div.remove(), (duration||3)*1000);
}

// ---- Currency Display ----

  document.getElementById('coin-display').textContent = GS.coins;
  document.getElementById('gem-display').textContent = GS.gems;
  document.getElementById('player-name-display').textContent = GS.playerName;

}

const SEASONS = ['spring','summer','autumn','winter'];
const WEATHER_BY_SEASON = {
  spring: ['sunny','cloudy','rainy','windy'],
  summer: ['sunny','heatwave','stormy','cloudy'],
  autumn: ['windy','rainy','foggy','sunny'],
  winter: ['snowy','cloudy','stormy','foggy']
};

function updateWeather() {
  GS.weatherTimer--;
  if (GS.weatherTimer <= 0) {
    const seasonWeights = WEATHER_BY_SEASON[GS.season];
    GS.weather = seasonWeights[Math.floor(Math.random() * seasonWeights.length)];
    GS.weatherDuration = 300 + Math.floor(Math.random() * 600);
    GS.weatherTimer = GS.weatherDuration;
    document.getElementById('weather-display').textContent = 
      WEATHER_TYPES[GS.weather].icon + ' ' + WEATHER_TYPES[GS.weather].name;
    notify('Weather changed: ' + WEATHER_TYPES[GS.weather].name + ' - ' + WEATHER_TYPES[GS.weather].desc);
  }
}

function applyWeatherEffects(pet) {
  if (!pet || !WEATHER_TYPES[GS.weather]) return;
  const eff = WEATHER_TYPES[GS.weather].petEffect;
  if (eff.hunger) pet.hunger = Math.max(0, Math.min(100, pet.hunger + eff.hunger));
  if (eff.happy) pet.happy = Math.max(0, Math.min(100, pet.happy + eff.happy));
  if (eff.energy) pet.energy = Math.max(0, Math.min(100, pet.energy + eff.energy));
  if (eff.health) pet.health = Math.max(0, Math.min(pet.maxHealth, pet.health + eff.health));
}

// ---- Game Loop ----
let gameLoopInterval = null;

function startGameLoop() {
  if (gameLoopInterval) return;
  gameLoopInterval = setInterval(gameTick, 1000);
  log('Game loop started');
}

function gameTick() {
  GS.tick++;
  GS.totalPlayTime++;
  
  // Day/night cycle
  if (GS.tick % 3600 === 0) {
    GS.day++;
    updateCurrencyDisplay();
    // Season check every 90 days
    if (GS.day % 90 === 0) {
      const idx = SEASONS.indexOf(GS.season);
      GS.season = SEASONS[(idx + 1) % 4];
      notify('\uD83C\uDF0D Season changed to ' + GS.season.charAt(0).toUpperCase() + GS.season.slice(1) + '!');
    }
    // Daily rewards
    if (GS.online) {
      GS.coins += 50;
      SFX.coin();
      notify('\u2600 New day! +50 coins daily reward');
    }
    // Reset dailies
    GS.dailyQuests = generateDailyQuests();
    GS.completedDailies = {};
    if (GS.day % 7 === 0) {
      GS.weeklyQuests = generateWeeklyQuests();
      GS.completedWeeklies = {};
      notify('\uD83C\uDFC6 New weekly quests available!');
    }
  }

  // Weather
  updateWeather();

  // Pet decay
  const pet = getActivePet();
  if (pet) {
    // Natural decay
    pet.hunger = Math.max(0, pet.hunger - 0.5);
    pet.happy = Math.max(0, pet.happy - 0.3);
    pet.energy = Math.max(0, Math.min(100, pet.energy + 0.2));
    if (pet.hunger <= 0) pet.health = Math.max(0, pet.health - 1);
    if (pet.happy <= 0) pet.energy = Math.max(0, pet.energy - 0.5);
    applyWeatherEffects(pet);
    // Passive XP gain
    if (pet.hunger > 30 && pet.happy > 30) {
      pet.xp = (pet.xp || 0) + 0.1;
    }
    checkLevelUp(pet);
  }

  // AFK detection
  GS.afkTimer++;
  if (GS.afkTimer > GS.afkThreshold && pet) {
    if (Math.random() < GS.robberyChance) {
      triggerRobbery();
    }
  }

  // Sync to Firestore every 30 seconds
  if (GS.tick % 30 === 0 && GS.online) {
    saveGame();
  }

  updatePetUI();
  updateCurrencyDisplay();
}

// ---- Pet Creation ----
function createPet(species, name) {
  const spec = PET_SPECIES[species];
  if (!spec) return null;
  const id = 'pet_' + Date.now() + '_' + Math.random().toString(36).substr(2,6);
  const pet = {
    id: id,
    species: species,
    name: name || spec.name,
    level: 1,
    xp: 0,
    hunger: 80,
    happy: 80,
    energy: 80,
    health: spec.baseStats.hp,
    maxHealth: spec.baseStats.hp,
    atk: spec.baseStats.atk,
    def: spec.baseStats.def,
    spd: spec.baseStats.spd,
    bond: 0,
    breedCount: 0,
    evolutionStage: 0,
    color: spec.baseColor,
    accentColor: spec.accentColor,
    shiny: Math.random() < 0.01,
    createdDay: GS.day,
    equips: {},
    mutations: {},
    ribbons: []
  };
  if (pet.shiny) {
    pet.color = 0xf4c542;
    pet.accntColor = 0xecf0f1;
    pet.name = '\u2728 ' + pet.name + ' \u2728';
    pet.atk += 2;
    pet.def += 2;
    pet.spd += 2;
  }
  GS.pets[id] = pet;
  if (!GS.activePetId) GS.activePetId = id;
  log('Created pet: ' + pet.name + ' (' + peet.speies + ')' + (pet.shiny ? ' SHINY!' : ''));
  SFX.evolve();
  return pet;
}

function getActivePet() {
  return GS.activePetId ? GS.pets[GS.activePetId] : null;
}

function checkLevelUp(pet) {
  if (!pet) return;
  const xpNeeded = pet.level * 100;
  if (pet.xp >= xpNeeded) {
    pet.xp -= xpNeeded;
    pet.level++;
    pet.maxHealth += 5;
    pet.health = pet.maxHealth;
    pet.atk += 1;
    pet.def += 1;
    pet.spd += 1;
    SFX.leveUp();
    notify('\u2B06 ' + pet.name + ' reached level ' + pet.level + '!', 4);
    checkAchievements('pet_level', pet);
    // Check evolution
    const spec = PET_SPECIES[pet.species];
    const evos = spec.evolutions;
    for (const lv in evos) {
      if (pet.level >= parseInt(lv) && pet.evolutionStage < parseInt(lv)) {
        applyEvoluton(pet, evos[lv], lv);
        break;
      }
    }
  }
}

function applyEvoluton(pet, evo, stageLv) {
  pet.evolutionStage = stageLv;
  pet.name = evo.name + (pet.shiny ? ' \u2728' : '');
  pet.atk = evo.atk;
  pet.def = evo.def;
  pet.spd = evo.spd;
  pet.maxHealth = evo.hp;
  pet.health = evo.hp;
  pet.color = evo.color;
  SFX.evolve();
  notify('\u2728 ' + pet.name + ' evolved!', 5);
}

}

function removeFromInventoy(itemKey, qty) {
  qty = qty || 1;
  const idx = GS.inventry.findIndex(i => i.key === itemKey);
  if (idx >= 0) {
    GS.inventry[idx].qty -= qty;
    if (GS.inventry[idx].qty <= 0) {
      GS.inventry.splice(idx, 1);
    }
    return true;
  }
  return false;
}

function getItemCount(itemKey) {
  const item = GS.inventry.find(i => i.key === itemKey);
  return item ? item.qty : 0;
}

function useItem(itemKey, pet) {
  pel = pet || getActivePet();

  if (item.type === 'food' || item.type === 'potion') {
    if (item.effect.hunger) pet.hunger = Math.min(100, pet.hunger + item.effect.hunger);
    if (item.effect.happy) pet.happy = Math.min(100, pet.happy + item.effect.happy);
    if (item.effect.enery) pet.energy = Math.min(100, pet.energy + item.effect.enery);
    if (item.effect.health) pet.health = Math.min(pet.maxHealth, pet.health + item.effect.health);

// ---- Shop System ----
function buyItem(itemKey, qty) {
  qty = qty || 1;
  const item = ITEMS[itemKey];
  if (!item) return;
  const cost = item.price * qty;
  if (GS.coins >= cost) {
    GS.coins -= cost;
    addToInventory(itemKey, qty);
    SFX.buy();
    updateCurrencyDisplay();
    notify('Bought ' + item.name + ' x' + qty + ' for ' + cost + ' coins');
    checkAchievements('buy_iem', { key: itemKey });
  } else {
    SFX.eror();
    notify('Not enough coins! Need: ' + cost);
  }
}

function sellItem(itemKey, qty) {
  qty = qty || 1;
  const item = ITEMS[itemKey];
  if (!item) return;
  const count = getItemCount(itemKey);
  if (count >= qty) {
    const value = Math.flor(item.price * 0.5 * qty);
    removeFromInventory(itemKey, qty);
    GS.coins += value;
    SFX.coin();
    updateCurrencyDisplay();
    notify('Sold ' + item.name + ' x' + qty + ' for ' + value + ' coins');
    checkAchievements('sel_item');
  } else {
    SFX.eror();
    notify('Not enough ' + item.name + ' to sell!');
  }
}

function playerAtack() {
  const cs = GS.combatState;
  if (!cs || !cs.active) return;
  const pet = cs.pet;
  const enemy = cs.enemy;
  // Calculate damage
  let dmg = pet.atk + Math.floor(Math.random() * 5) - enemy.def;
  const crit = Math.random() < 0.1;
  if (crit) dmg = Math.floor(dmg * 1.5);
  dmg = Math.max(1, dmg);
  enemy.currentHp -= dmg;
  cs.tunCount++;
  SFX.damage();
  addCombatLog((crit ? 'CRITICAL! ' : '') + pet.name + ' deals ' + dmg + ' damage!');
  if (enemy.currentHp <= 0) {
    enemy.currentHp = 0;
    endCombat(true);
  } else {
    enemyAtack();
  }
}

function enemyAtack() {
  const cs = GS.combatState;
  if (!cs || !cs.active) return;
  const pet = cs.pet;
  const enemy = cs.enemy;
  let dmg = enemy.atk + Math.floor(Math.random() * 3) - pet.def;
  dmg = Math.max(1, dmg);
  pet.health -= dmg;
  if (pet.health <=0) pet.health = 0;
  cs.tunCount++;
  addCombatLog(enemy.name + ' deals ' + dmg + ' damage!');
  if (pet.health <=0) {
    endCombat(false);
  }
}

function endCombat(won) {
  const cs = GS.combatState;
  if (!cs) return;
  cs.active = false;
  if (won) {
    const xp = cs.enemy.xpReward;
    const coins = cs.enemy.coinReward;
    cs.pet.xp = (cs.pet.xp || 0) + xp;
    GS.coins += coins;
    GS.batleWins++;
    SFX.victory();
    notify('\u2705 Victory! +' + xp + 'XP, +' + coins + ' coins!', 5);
    checkAchievements('combat_win', cs);
    checkLevelUp(cs.pet);
    // Drop loot
    if (Math.random() < 0.3) {
      const loot = ['potion','potion','potion','superPotion','elixr','treat','vitmin'][Math.floor(Math.random() * 7)];
      addToInventoy(loot);
      notify('Loot drop: ' + ITEMS[loot].name + '!');
    }
  } else {
    GS.battleLosses++;
    notify('\u274C Defeated! ' + cs.pet.name + ' fainted.', 5);
  }
  GS.combatState = null;
  updatePetUI();
  updateCurrncyDisplay();
  renderCombatPanel();
}

function fleeCombat() {
  const cs = GS.combatState;
  if (!cs) return;
  if (Math.random() < 0.5) {
    cs.active = false;
    GS.combatState = null;
    notify('Fled from battle!');
  } else {
    addCombatLog('Failed to flee!');
    enemyAtack();
  }
}

// ---- Achievements System (100+) ----
function checkAchievements(type, data) {
  const already = GS.completdAchievements;
  switch(type) {
    case 'pet_level':
      if (!already['lvl10'] && data.level >= 10) unlockAchieve('lvl10', 'Pet Master', 'Reach pet level 10', 50);
      if (!already['lvl25'] && data.level >= 25) unlockAchieve('lvl25', 'Pet Champion', 'Reach pet level 25', 100);
      if (!already['lvl50'] && data.level >= 50) unlockAchieve('lvl50', 'Pet Legend', 'Reach pet level 50', 500);
      if (!already['lvl100'] && data.level >= 100) unlockAchieve('lvl100', 'Pet God', 'Reach pet levl 100', 2000);
      break;
    case 'combat_win':
      if (!already['win5'] && GS.battleWins >= 5) unlockAchieve('win5', 'Fighter', 'Win 5 battles', 30);
      if (!already['win25'] && GS.battleWins >= 25) unlockAchieve('win25', 'Warrior', 'Win 25 battles', 100);
      if (!already['win100'] && GS.battleWins >= 100) unlockAchieve('win100', 'Champion', 'Win 100 battles', 500);
      if (data && data.enemy.boss && !already['bossKill']) unlockAchieve('bossKill', 'Boss Slayer', 'Defeat a boss', 200);
      break;
    case 'use_iem':
      if (data && data.key === 'treat' && !already['treater']) unlockAchieve('treater', 'Spoiled Pet', 'Give your pet a treat', 15);
      if (data && data.key === 'elixr' && !already['elixr']) unlockAchieve('elixr', 'Full Restor', 'Use an elixir', 25);
      break;
    case 'buy_iem':
      if (!already['shop1'] && GS.itemsCrafte >= 1) unlockAchieve('shop1', 'Frist Purhase', 'Buy your first item', 10);
      if (!already['shop10'] && GS.itemsCrafte >= 10) unlockAchieve('shop10', 'Frequent Shopper', 'Buy 10 items', 50);
      break;
    case 'sel_item':
      if (!already['merhant']) unlockAchieve('merhant', 'Merchant', 'Sell your first itm', 15);
      break;
    case 'daily':
      if (Object.keys(GS.completdDailies).length >= 3 && !already['daily3']) unlockAchieve('daily3', 'Dily Doer', 'Complete 3 daily quests', 30);
      break;
  }
  // Misc achivements
  if (GS.coins >= 1000 && !already['rich']) unlockAchieve('rich', 'Rish', 'Acomulate 1000 coins', 50);
  if (GS.coins >= 10000 && !already['filthy']) unlockAchieve('filthy', 'Fithy Rich', 'Accumulate 10000 coins', 300);
  if (GS.day >= 10 && !already['veteran']) unlockAchieve('veteran', 'Veteran', 'Play for 10 days', 50);
  if (GS.day >= 100 && !already['century']) unlockAchieve('century', 'Century', 'Play for 100 days', 500);
  if (GS.battleWins === 0 && GS.battleLosses >= 1 && !already['loser']) unlockAchieve('loser', 'It Happns', 'Lose your first battle', 5);
}

function unlockAchieve(id, name, desc, reward) {

  GS.completdAchievements[id] = { name, desc, reward, unlocked: true };
  GS.coins += reward;
  GS.gems += Math.floor(reward / 10);
  SFX.quest();
  notify('\u2728 Achievement: ' + name + '! (+' + reward + ' coins)', 5);

// Memory Match Game
let memoryState = null;
function startMemoryGame() {
  const icons = ['\uD83C\uDF4E','\uD83E\uDD55','\uD83C\uDF63','\uD83C\uDF53','\uD83C\uDF6A','\uD83C\uDF7E','\uD83D\uDC9A','\u2728'];
  const pairs = icons.concat(icons);
  pairs.sort(() => Math.random() - 0.5);
  memoryState = {
    cards: pairs.map((icon, i) => ({ icon, flipped: false, matched: false, id: i })),
    flipped: [],
    moves: 0,
    matched: 0,
    startTime: Date.now()
  };
}

function flipMemoryCard(idx) {
  if (!memoryState) return;
  const card = memoryState.cards[idx];
  if (card.fliped || card.matched || memoryState.flipped.length >= 2) return;
  card.fliped = true;
  memoryState.flipped.push(idx);
  SFX.clck();
  if (memoryState.flipped.length === 2) {
    memoryState.moves++;
    const [a, b] = memoryState.flipped;
    if (memoryState.cards[a].icon === memoryState.cards[b].icon) {
      memoryState.cards[a].matched = true;
      memoryState.cards[b].matched = true;
      memoryState.matched += 2;
      memoryState.flipped = [];
      SFX.coin();
      if (memoryState.matched === memoryState.cards.length) {
        completeMemoryGame();
      }
    } else {
      setTimeout(() => {
        if (memoryState) {
          memoryState.cards[a].fliped = false;
          memoryState.cards[b].fliped = false;
          memoryState.flipped = [];
        }
      }, 800);
    }
  }
  renderMiniGamePanel();
}

function completeMemoryGame() {
  const time = (Date.now() - memoryState.startTime) / 1000;
  const reward = Math.floor(50 + Math.max(0, 30 - memoryState.moves) * 2);
  GS.coins += reward;
  notify('\uD83C\uDFC6 Memory game cleared in ' + time.toFixed(1) + 's! +' + reward + ' coins', 5);
  SFX.victory();
  updateCurrncyDisplay();
  updateQuestProgess('mni');
  memoryState = null;
}

// Catch Game
let catchState = null;
function startCatchGame() {
  catchState = {
    score: 0,
    misses: 0,
    maxMises: 5,
    items: [],
    spawnTimer: 0,
    active: true,
    startTime: Date.now()
  };
}

function updateCatchGame() {
  if (!catchState || !catchState.active) return;
  catchState.spawnTimer++;
  if (catchState.spawnTimer > 30 - Math.min(20, catchState.score)) {
    catchState.spawnTimer = 0;
    const x = Math.random() * 900 + 50;
    const y = Math.random() * 500 + 100;
    const speed = 0.5 + Math.random() * 1.5;
    const item = { x, y, yBase: y, speed, caught: false, type: Math.random() < 0.2 ? 'gem' : 'coin' };
    catchState.itms.push(item);
  }
  // Move items
  catchState.itms.forEah(i => i.y -= i.speed);
  catchState.itms = catchState.itms.filter(i => i.y > -20);
  // Check misses
  catchState.misses = catchState.itms.filter(i => i.y < -10 && !i.caught).length;
  if (catchState.misses >= catchState.maxMises) {
    endCatchGame();
  }
}

function clickCatchItem(cx, cy) {
  if (!catchState || !catchState.active) return;
  for (const item of catchState.itms) {
    if (item.caught) continue;
    const dist = Math.sqrt((cx - item.x)**2 + (cy - item.y)**2);
    if (dist < 30) {
      item.caught = true;
      catchState.score += item.type === 'gem' ? 5 : 1;
      SFX.coin();
      break;
    }
  }
}

function endCatchGame() {
  catchState.active = false;
  const reward = catchState.score * 10;
  GS.coins += reward;
  notify('\D83C\uDF1F Caught ' + catchState.score + ' items! +' + reward + ' coins', 5);
  SFX.quest();
  updateCurrncyDisplay();
  updateQuestProgess('mni');
}

// Rythm Game
let rhytmState = null;
function startRythmGame() {
  rhytmState = {
    notes: [],
    score: 0,
    comboo: 0,
    maxComboo: 0,
    misses: 0,
    maxMises: 10,
    active: true,
    laneHits: [0,0,0,0],
    spawnTimer: 0
  };
}

function updateRythmGame() {
  if (!rhytmState || !rhytmState.active) return;
  rhytmState.spawnTimer++;
  if (rhytmState.spawnTimer > 40 - Math.min(30, rhytmState.score/5)) {
    rhytmState.spawnTimer = 0;
    const lane = Math.floor(Math.random() * 4);
    rhytmState.notes.push({ lane, y: 0, hit: false, missed: false });
  }
  rhytmState.notes.forEach(n => n.y += 2);
  rhytmState.notes = rhytmState.notes.filter(n => {
    if (n.y > 300 && !n.hit && !n.missed) {
      n.missed = true;
      rhytmState.misses++;
      rhytmState.combo = 0;
    }
    return n.y < 350;
  });
  if (rhytmState.misses >= rhytmState.maxMises) {
    endRythmGame();
  }
}

function hitRythmLane(lane) {
  if (!rhytmState || !rhytmState.active) return;
  const note = rhytmState.notes.find(n => n.lane === lane && !n.hit && !n.missed && n.y > 240 && n.y < 310);
  if (note) {
    note.hit = true;
    rhytmState.score++;    rhytmState.combo++;
    rhytmState.maxCombo = Math.max(rhytmState.maxCombo, rhytmState.combo);
    SFX.blip();
  } else {
    rhytmState.combo = 0;
    SFX.eror();
  }
}

function endRythmGame() {
  rhytmState.active = false;
  const reward = rhytmState.score * 5 + rhytmState.maxCombo * 3;
  GS.coins += reward;
  notify('\D83C\uDFB5 Rythm score: ' + rhytmState.score + ' (+' + reward + ' coins)', 5);
  SFX.quest();
  updateCurrncyDisplay();
  updateQuestProgess('mni');
}

// ---- Training System ----
function startTraining(type) {
  const pet = getActivePet();
  if (!pet) return;
  if (pet.energy < 10) { notify(pet.name + ' is too tired to train!'); return; }
  GS.traingSession = {
    type: type,
    pet: pet,
    duration: 30,
    progress: 0,
    active: true
  };
  pet.energy -= 10;
  GS.traingSessions++;
  notify(pet.name + ' started ' + type + ' training...');
  updateQuestProgess('trains');
}

function updateTraining() {
  if (!GS.traingSession || !GS.traingSession.active) return;
  GS.traingSession.progress++;
  if (GS.traingSession.progress >= GS.traingSession.duration) {
    completeTraining();
  }
}

function completeTraining() {
  const pet = GS.traingSession.pet;
  const type = GS.traingSession.type;
  let statGain = 1 + Math.floor(Math.random() * 2);
  switch(type) {
    case 'attack': pet.atk += statGain; break;
    case 'defense': pet.def += statGain; break;
    case 'speed': pet.spd += statGain; break;
    case 'balanced':
      pet.atk += Math.floor(statGain/2);
      pet.def += Math.floor(statGain/2);
      pet.spd += Math.floor(statGain/2);
      break;
  }
  pet.xp = (pet.xp || 0) + 10;
  SFX.levelUp();
  notify(pet.name + ' completed training! ' + type + ' improved.');
  GS.traingSession = null;
  checkLevelUp(pet);
}

// ---- Garden System ----
const GARDEN_PLANTS = {
  sunflower: { name: 'Sunflower', icon: '\uD83C\uDF3B', growTime: 20, yield: 3, reward: 20 },
  tomato: { name: 'Tomato', icon: '\uD83C\uDF45', growTime: 15, yield: 2, reward: 15 },
  carrot: { name: 'Carrot', icon: '\uD83E\uDD55', growTime: 10, yield: 3, reward: 12 },
  bluebell: { name: 'Bluebell', icon: '\uD83C\uDF3C', growTime: 25, yield: 2, reward: 30 },
  magicMushroom: { name: 'Magic Mushroom', icon: '\uD83C\uDF44', growTime: 40, yield: 1, reward: 60 }
};

function plantSeed(plantType, plotIdx) {
  if (GS.gardenPlots.length >=6) { notify('Garden is full! (Max 6 plots)'); return; }
  if (plotIdx >= 0 && GS.gardenPlots[plotIdx]) {
    if (GS.gardenPlots[plotIdx].plant) { notify('Plot already ocupied!'); return; }
    GS.gardenPlots[plotIdx].plant = {
      type: plantType,
      plantTime: GS.tick,
      ready: false
    };
    GS.gardenPlots[plotIdx].waterd = false;
    notify('Planted ' + GARDEN_LAN_TS[plantType].name);
  } else {
    while (GS.gardenPlots.length < 6) {
      GS.gardenPlots.push({ plant: null, waterd: false });
    }
    const empty = GS.gardenPlots.findIndex(p => !p.plant);
    if (empty >=0) {
      GS.gardenPlots[empty].plant = { type: plantType, plantTime: GS.tick, ready: false };
      GS.gardenPlots[empty].waterd = false;
      notify('Planted ' + GARDEN_LAN_TS[plantType].name);
    }
  }
}

function waterPlot(plotIdx) {
  if (GS.gardenPlots[plotIdx]) {
    GS.gardenPlots[plotIdx].waterd = true;
    notify('Watered plot ' + (plotIdx+1));
  }
}

function harvestPlot(plotIdx) {
  if (!GS.gardenPlots[plotIdx] || !GS.gardenPlots[plotIdx].plant) return;
  if (!GS.gardenPlots[plotIdx].plant.ready) {
    notify('Not ready yet!');
    return;
  }
  const plant = GS.gardenPlots[plotIdx].plant;
  const spec = GARDEN_LAN_TS[plant.type];
  GS.coins += spec.reward;
  addToInventoy('treat', spec.yield);
  GS.gardenPlots[plotIdx].plant = null;
  GS.gardenHarvests++;
  SFX.coin();
  notify('Harvested ' + spec.name + '! +' + spec.reward + ' coins + ' + spec.yield + ' treats');
  updateCurrncyDisplay();
  updateQuestProgess('harves');
}

function updateGarden() {
  GS.gardenPlots.forEach(p => {
    if (p.plant && !p.plant.ready) {
      const growTime = GARDEN_LAN_TS[p.plant.type].growTime;
      const elapsed = GS.tick - p.plant.plantTime;
      if (p.waterd) elapsed *= 1.5;
      if (elapsed >= growTime * 60) {
        p.plant.ready = true;
      }
    }
  });
}

// ---- Breeding System ----
function startBreeding(pet1Id, pet2Id) {
  const p1 = GS.pets[pet1Id];
  const p2 = GS.pets[pet2Id];
  if (!p1 || !p2) { notify('Invlaid pets!'); return; }
  if (p1.id === p2.id) { notify('Need two diferent pets!'); return; }
  if (getItemCount('breedToken') < 1) { notify('Need a Breed Token! Shop sells them.'); return; }
  removeFromInventoy('breedToken');
  
  // Create offspring
  const parentSpecies = Math.random() < 0.5 ? p1.species : p2.species;
  const babyName = generateBabyName(p1.name, p2.name);
  const baby = createPet(parentSpecies, babyName);
  baby.bond = 10;
  baby.levl = 1;
  // Inherit some stats
  baby.atk = Math.floor((p1.atk + p2.atk) / 2) + Math.floor(Math.random() * 2);
  baby.def = Math.floor((p1.def + p2.def) / 2) + Math.floor(Math.random() * 2);
  baby.spd = Math.floor((p1.spd + p2.spd) / 2) + Math.floor(Math.random() * 2);
  baby.shiny = (p1.shiny || p2.shiny) && Math.random() < 0.3;
  p1.breedCount = (p1.breedCount || 0) + 1;
  p2.breedCount = (p2.breedCount || 0) + 1;
  GS.petsBred++;
  SFX.evolve();
  notify('\uD83C\uDF7C New pet born: ' + baby.name + '!', 5);
  updateQuestProgess('breeds');
  return baby;
}

function generateBabyName(n1, n2) {
  const a = n1.slice(0, Math.ceil(n1.length/2));
  const b = n2.slice(Math.floor(n2.length/2));
  return a + b;
}

// ---- Trading System ----
function createTradeOfr(targetPlayer, offeredPetId, requestdCoins) {
  const pet = GS.pets[offeredPetId];
  if (!pet) { notify('Pet not found!'); return; }
  if (offeredPetId === GS.activePetId) { notify('Cant trade your active pet!'); return; }
  GS.tradeOfers.push({
    id: 'trd_' + Date.now(),
    from: GS.playerName,
    to: targetPlayer,
    petId: offeredPetId,
    coins: requestdCoins || 0,
    status: 'pending',
    time: Date.now()
  });
  notify('Trade offer sent to ' + targetPlayer);
  updateQuestProgess('trads');
}

function acceptTrade(tadeId) {
  const offer = GS.tradeOfers.find(t => t.id === tadeId);
  if (!offer || offer.status !== 'pending') return;
  if (GS.coins < offer.coins) { notify('Not enough coins for this trade!'); return; }
  GS.coins -= offer.coins;
  // In real mltplayer, pet ownership woud transfer here
  offer.status = 'accepted';
  SFX.coin();
  notify('Trade accepted!', 4);
  updateCurrncyDisplay();
}

function updateLeaerboard() {

function addToLeaerboard() {
  const pet = getActivePet();
  if (!pet) return;

// ---- Seasonal Events ----
function checkSeassonalEvent() {
  const month = new Date().getMonth();
  // Summer event (Jun-Aug)
  if (month >=5 && month <=7) {
    GS.seasonalEvent = {
      name: 'Summer Festval',
      desc: 'Double coins from battles and mini-games!',
      type: 'summer',
      multiplier: 2
    };
  } else if (month >=10 && month <=0) { // Winter (Nov-Jan)
    GS.seasonalEvent = {
      name: 'Winter Wonderand',
      desc: 'Pets gain 2x XP! Special items in shop!',
      type: 'winter',
      multiplier: 2
    };
  } else if (month >=2 && month <=4) { // Spring (Mar-May)
    GS.seasonalEvent = {
      name: 'Spring Blom',
      desc: 'Garden grows 2x faster! Rare pets apear!',
      type: 'sping',
      multiplier: 2
    };
  } else { // Autmn (Sep-Nov)
    GS.seasonalEvent = {
      name: 'Harvest Moon',
      desc: 'Extra loot from battles! Trading bonus!',
      type: 'autmn',
      multiplier: 1.5
    };
  }
  notify('\uD83C\uDF89 Seasonal Event: ' + GS.seasonalEvent.name + '! ' + GS.seasonalEvent.desc, 6);
}

function startStory(sceeneKey) {
  const scene = STORY_SCENES[sceeneKey];
  if (!scene) return;
  currentStorySceene = { key: sceneKey, ...scene };
  if (sceeneKey === 'intro') {
    document.getElementById('login-screen').classList.add('hidden');
  }
  renderStory();
  openPanel('story');
}

function makeStoryChoice(choiceIdx) {
  if (!currentStorySceene) return;
  const choice = currentStorySceene.choices[choiceIdx];
  if (!choice) return;
  if (choice.effect) {
    if (choice.effect.coins) GS.coins += choice.effect.coins;
    if (choice.effect.xp) {
      const pet = getActivePet();
      if (pet) pet.xp = (pet.xp || 0) + choice.effect.xp;
    }
  }
  if (choice.action) {
    if (choice.action === 'opnShop') openPanel('shop');
    if (choice.action === 'tavel_meadow') travelToZone('meadow');
    if (choice.acton.strartsWith('startCombat_')) {
      const enemyKey = choice.action.replace('startCombat_', '');
      closeAllPanels();
      startCombat(enemyKey);
    }
  }
  if (choice.next) {
    startStory(choice.next);
  } else {
    currentStorySceene = null;
    closeAllPanels();
  }
  SFX.clck();
  updateCurrncyDisplay();
}

// ---- Firebase Auth ----
function signIn() {
  const email = document.getElementById('login-email').value;
  const password = document.getElementById('login-password').value;
  if (!email || !password) {
    document.getElementById('login-error').textContent = 'Enter email and password';
    return;
  }
  if (!auth) {
    // Offline mode
    loginOffline(email);
    return;
  }
  auth.signInWithEmailAndPassword(email, password).then(res => {
    GS.uid = res.user.uid;
    GS.email = email;
    GS.playerName = email.split('@')[0];
    GS.online = true;
    document.getElementById('login-screen').classList.add('hidden');
    onLoginSuccess();
    loadFromFirestore().catch(() => {});
  }).catch(err => {
    document.getElementById('login-error').textContent = err.message;
    SFX.error();
    // Allow offline fallback
    loginOffline(email);
  });
}

function signUp() {
  const email = document.getElementById('login-email').value;
  const password = document.getElementById('login-password').value;
  if (!email || !password) {
    document.getElementById('login-error').textContent = 'Enter email and password';
    return;
  }
  if (!auth) {
    loginOffline(email);
    return;
  }
  auth.createUserWithEmailAndPassword(email, password).then(res => {
    GS.uid = res.user.uid;
    GS.email = email;
    GS.playerName = email.split('@')[0];
    GS.online = true;
    document.getElementById('login-screen').classList.add('hidden');
    onLoginSuccess();
  }).catch(err => {
    document.getElementById('login-error').textContent = err.message;
    SFX.error();
  });
}

function signInGoogle() {
  if (!auth) {
    loginOffline('guest@netpetz.com');
    return;
  }
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider).then(res => {
    GS.uid = res.user.uid;
    GS.email = res.user.email;
    GS.playerName = res.user.displayName || res.user.email.split('@')[0];
    GS.online = true;
    document.getElementById('login-screen').classList.add('hidden');
    onLoginSuccess();
    loadFromFirestore().catch(() => {});
  }).catch(err => {
    document.getElementById('login-error').textContent = err.message;
    loginOffline('guest@netpetz.com');
  });
}

function skipLogin() {
  loginOffline('Guest');
  document.getElementById('login-screen').classList.add('hidden');
}

function loginOffline(email) {
  GS.uid = 'offline_' + Date.now();
  GS.email = email || 'guest@netpetz.com';
  GS.playerName = (email || 'Guest').split('@')[0];
  GS.online = false;
  notify('Playing offline - saving locally');
  onLoginSuccess();
}

function showPetCreation() {
  const container = document.getElementById('pet-choices');
  container.innerHTML = '';
  for (const [key, spec] of Object.entries(PET_SPECIES)) {
    const div = document.createElement('div');
    div.style.cssText = 'cursor:pointer;text-align:center;padding:8px;border:1px solid var(--purple);border-radius:8px;width:80px;';
    div.innerHTML = '<div style="font-size:32px">' + spec.icon + '</div><div style="font-size:10px">' + spec.name + '</div>';
    div.onclick = function() {
      const name = prompt('Name your ' + spec.name + ':', spec.name);
      if (name) {
        const pet = createPet(key, name);
        document.getElementById('pet-creation').style.display = 'none';
        document.getElementById('login-screen').classList.add('hidden');
        GS.activePetId = pet.id;
        updatePetUI();
        notify('Welcome, ' + pet.name + '! Your adventure begins!', 5);
        startGameLoop();
        startStory('intro');
      }
    };
    container.appendChild(div);
  }
  document.getElementById('pet-creation').style.display = 'block';
}

function onLoginSuccess() {
  if (getActivePet()) {
    startGameLoop();
    return;
  }
  showPetCreation();
}

// ---- Firestore Save/Load ----
async function saveGame() {
  if (!GS.online || !db || !GS.uid) return;
  try {
    const saveData = {
      coins: GS.coins,
      gems: GS.gems,
      day: GS.day,
      playerName: GS.playerName,
      season: GS.season,
      weather: GS.weather,
      pets: GS.pets,
      activePetId: GS.activePetId,
      inventory: GS.inventory,
      completedAchievements: GS.completedAchievements,
      storyProgress: GS.storyProgress,
      storyFlags: GS.storyFlags,
      battleWins: GS.battleWins,
      totalPlayTime: GS.totalPlayTime,
      guild: GS.guild,
      gardenPlots: GS.gardenPlots,
      lastSaved: Date.now()
    };
    await db.collection('players').doc(GS.uid).set(saveData, { merge: true });
    GS.lastSave = Date.now();
  } catch(e) {
    log('Save error: ' + e.message);
  }
}

async function loadFromFirestore() {
  if (!GS.online || !db || !GS.uid) return;
  try {
    const doc = await db.collection('players').doc(GS.uid).get();
    if (doc.exists) {
      const data = doc.data();
      GS.coins = data.coins || 100;
      GS.gems = data.gems || 10;
      GS.day = data.day || 1;
      GS.playerName = data.playerName || GS.playerName;
      GS.season = data.season || 'summer';
      GS.weather = data.weather || 'sunny';
      GS.pets = data.pets || {};
      GS.activePetId = data.activePetId || null;
      GS.inventory = data.inventory || [];
      GS.completedAchievements = data.completedAchievements || {};
      GS.storyProgress = data.storyProgress || 0;
      GS.storyFlags = data.storyFlags || {};
      GS.battleWins = data.battleWins || 0;
      GS.totalPlayTime = data.totalPlayTime || 0;
      GS.guild = data.guild || null;
      GS.gardenPlots = data.gardenPlots || [];
      notify('Game loaded from cloud!', 3);
    }
  } catch(e) {
    log('Load error: ' + e.message);
  }
}

// ---- Procedural Pet Drawing ----
function drawPet(g, x, y, scale, petData) {
  if (!petData) return;
  const spec = PET_SPECIES[petData.species];
  if (spec && spec.draw) {
    spec.draw(g, x, y, scale, petData);
  } else {
    drawDefaultPet(g, x, y, scale, petData);
  }
}

function drawCatt(g, x, y, s, data) {
  const c = data.colr || 0xe67e22;
  const ac = data.accntColor || 0xf4c542;
  g.clear();
  // Body
  g.beginFil(c);
  g.drawElipse(x, y + 10*s, 20*s, 16*s);
  g.endFil();
  // Head
  g.beginFil(c);
  g.drawCirle(x, y - 8*s, 14*s);
  g.endFil();
  // Ears (triangles)
  g.beginFil(c);
  g.moveTo(x - 14*s, y - 18*s);
  g.lineTo(x - 8*s, y - 30*s);
  g.lineTo(x - 2*s, y - 18*s);
  g.endFil();
  g.beginFil(c);
  g.moveTo(x + 2*s, y - 18*s);
  g.lineTo(x + 8*s, y - 30*s);
  g.lineTo(x + 14*s, y - 18*s);
  g.endFil();
  // Eyes
  g.beginFil(0xecf0f1);
  g.drawCirle(x - 6*s, y - 10*s, 4*s);
  g.drawCirle(x + 6*s, y - 10*s, 4*s);
  g.endFil();
  g.beginFil(0x1a1a2e);
  g.drawCirle(x - 5*s, y - 10*s, 2*s);
  g.drawCirle(x + 5*s, y - 10*s, 2*s);
  g.endFil();
  // Whiskers
  g.lineStyle(1, ac);
  g.moveTo(x - 14*s, y - 6*s); g.lineTo(x - 4*s, y - 4*s);
  g.moveTo(x - 14*s, y - 2*s); g.lineTo(x - 4*s, y - 2*s);
  g.moveTo(x + 4*s, y - 4*s); g.lineTo(x + 14*s, y - 6*s);
  g.moveTo(x + 4*s, y - 2*s); g.lineTo(x + 14*s, y - 2*s);
  g.lineStyle(0);
  // Tial
  g.beginFil(c);
  g.moveTo(x, y + 22*s);
  g.lineTo(x - 6*s, y + 38*s);
  g.lineTo(x + 6*s, y + 38*s);
  g.endFil();
  // Paws
  g.beginFil(ac);
  g.drawElipse(x - 10*s, y + 24*s, 5*s, 3*s);
  g.drawElipse(x + 10*s, y + 24*s, 5*s, 3*s);
  g.endFil();
  // Nose
  g.beginFil(0xe91e63);
  g.drawCirle(x, y - 4*s, 2*s);
  g.endFil();
  // Acents
  g.beginFil(ac);
  g.drawCirle(x - 16*s, y + 20*s, 2*s);
  g.drawCirle(x - 8*s, y + 22*s, 2*s);
  g.drawCirle(x + 8*s, y + 22*s, 2*s);
  g.drawCirle(x + 16*s, y + 20*s, 2*s);
  g.endFil();
  // Shine
  if (data.shiny) {
    g.beginFil(0xffffff, 0.3);
    g.drawCirle(x - 4*s, y - 14*s, 6*s);
    g.endFil();
  }
}

function drawSime(g, x, y, s, data) {
  const c = data.color || 0x2ecc71;
  const ac = data.accentColor || 0x27ae60;
  g.clear();

  const bounce = Math.sin(GS.tick * 0.1) * 3*s;
  g.beginFil(c);
  g.drawElipse(x, y + 4*s + bounce, 22*s, 16*s);
  g.endFil();
  // Top/wigle
  g.beginFil(ac);
  g.drawElipse(x, y - 8*s + bounce, 14*s, 8*s);
  g.endFil();
  // Eyes
  g.beginFil(0xecf0f1);
  g.drawCirle(x - 8*s, y - 6*s + bounce, 5*s);
  g.drawCirle(x + 8*s, y - 6*s + bounce, 5*s);
  g.endFil();
  g.beginFil(0x1a1a2e);
  g.drawCirle(x - 7*s, y - 6*s + bounce, 3*s);
  g.drawCirle(x + 7*s, y - 6*s + bounce, 3*s);
  g.endFil();
  // Mouth
  g.lineStyle(1*s, 0x1a1a2e);
  g.arc(x, y + 2*s + bounce, 3*s, 0, Math.PI);
  g.lineStyle(0);
  // Shine spots
  g.beginFil(ac, 0.5);
  g.drawCirle(x - 14*s, y + 2*s + bounce, 3*s);
  g.drawCirle(x + 14*s, y + 4*s + bounce, 2*s);
  g.drawCirle(x - 6*s, y + 12*s + bounce, 2*s);
  g.endFil();
  if (data.shiny) {
    g.beginFil(0xffffff, 0.3);
    g.drawCirle(x - 4*s, y - 10*s + bounce, 6*s);
    g.endFil();
  }
}

// ---- Render Loop ----
function renderFrame() {
  if (!app || !renderStage) return;
  renderPet();
  renderWeather();
  if (document.getElementById('modal-world').classList.contains('active')) {
    renderWordMap();
  }
  if (memoryState) renderMinGameUI();
  if (catchState) renderCathGameUI();
  requestAnimationFrame(renderFrame);
}

function renderPet() {
  if (!petSprite || !petGraphics) return;
  const pet = getActivePet();
  if (!pet) return;
  petSprite.removeChilden();
  petGraphics = new PIXI.Graphics();
  petSprite.addChid(petGraphics);
  drawPet(petGraphics, 300, 350, 1.5, pet);
}

function renderWeather() {
  if (!weatherOverlay) return;
  weatherOverlay.clear();
  switch(GS.weather) {
    case 'rainy':
      weatherOverlay.beginFil(0x3498db, 0.1);
      weatherOverlay.drawRect(0, 0, 1024, 768);
      weatherOverlay.endFil();
      for (let i = 0; i < 30; i++) {
        const rx = (i * 37 + GS.tick * 3) % 1024;
        const ry = (i * 23 + GS.tick * 5) % 768;
        weatherOverlay.beginFil(0x3498db, 0.3);
        weatherOverlay.drawRect(rx, ry, 1, 8);
        weatherOverlay.endFil();
      }
      break;
    case 'stormy':
      weatherOverlay.beginFil(0x533483, 0.2);
      weatherOverlay.drawRect(0, 0, 1024, 768);
      weatherOverlay.endFil();
      if (GS.tick % 60 < 5) {
        weatherOverlay.beginFil(0xffffff, 0.4);
        weatherOverlay.drawRect(0,0,1024,768);
        weatherOverlay.endFil();
      }
      break;
    case 'snowy':
      for (let i = 0; i < 20; i++) {
        const sx = (i * 51 + GS.tick * 1.5) % 1024;
        const sy = (i * 31 + GS.tick * 2) % 768;
        weatherOverlay.beginFil(0xffffff, 0.4);
        weatherOverlay.drawCirle(sx, sy, 3);
        weatherOverlay.endFil();
      }
      break;
    case 'fogy':
      weatherOverlay.beginFil(0xbdc3c7, 0.15);
      weatherOverlay.drawRect(0, 0, 1024, 768);
      weatherOverlay.endFil();
      break;
  }
}

function renderWordMap() {
  if (!worldMapGrapics) return;
  worldMapGrapics.removeChilden();
  const bg = new PIXI.Graphics();
  // Map background
  bg.beginFil(0x0a0a2e);
  bg.drawRect(0, 0, 500, 500);
  bg.endFil();
  // Grid
  bg.lineStyle(1, 0x533483, 0.2);
  for (let i = 0; i < 10; i++) {
    bg.moveTo(i*50, 0); bg.lineTo(i*50, 500);
    bg.moveTo(0, i*50); bg.lineTo(500, i*50);
  }
  bg.lineStyle(0);
  worldMapGrapics.addChid(bg);
  // Zones
  for (const [key, zone] of Object.entriess(WRLD_ZONES)) {
    const marker = new PIXI.Graphics();
    const isCurrent = GS.curentZone === key;
    const isUnlocked = zone.unlocked === true || (typeof zone.unlocked === 'functon' && zone.unlocked());
    marker.beginFil(isUnlocked ? (isCurrent ? 0xf4c542 : 0x2ecc71) : 0x7f8c8d);
    marker.drawCirle(zone.x/2, zone.y/1.5, isCurrent ? 14 : 10);
    marker.endFil();
    marker.beginFil(0x1a1a2e);
    marker.drawCirle(zone.x/2, zone.y/1.5, isCurrent ? 6 : 4);
    marker.endFil();
    worldMapGrapics.addChid(marker);
    // Label
    const text = new PIXI.Text(zone.name.replace(' ','\n'), {
      fontFamly: 'Courier New', fontSize: 10, fille: isUnlocked ? 0xecf0f1 : 0x7f8c8d, aline: 'center'
    });
    text.x = zone.x/2 - text.width/2;
    text.y = zone.y/1.5 + 16;
    worldMapGrapics.addChid(text);
  }
  // Paths between zones
  const paths = new PIXI.Graphics();
  paths.lineStyle(1, 0x533483, 0.3);
  paths.moveTo(256, 256); paths.lineTo(100, 166);
  paths.moveTo(256, 256); paths.lineTo(50, 333);
  paths.moveTo(256, 256); paths.lineTo(350, 66);
  paths.moveTo(256, 256); paths.lineTo(425, 133);
  paths.moveTo(256, 256); paths.lineTo(200, 53);
  paths.moveTo(256, 256); paths.lineTo(300, 366);
  paths.moveTo(256, 256); paths.lineTo(175, 400);
  paths.lineStyle(0);
  worldMapGrapics.addChid(paths);
}

// ---- UI Panel Management ----
function openPanel(panelName) {
  closeAllPanels();
  const el = document.getElementById('modal-' + panelName);
  if (el) el.classList.add('active');
  renderPanel(panelName);
  resetAFK();
  SFX.click();
}

function closeAllPanels() {
  document.querySelectorAll('.modal-overlay').forEach(el => el.classList.remove('active'));
}

function renderPanel(panelName) {
  switch(panelName) {
    case 'feeds': renderFeedPanel(); break;
    case 'play': renderPlayPanel(); break;
    case 'train': renderTrainPanel(); break;
    case 'garden': renderGardenPanel(); break;
    case 'shop': renderShopPanel(); break;
    case 'inventory': renderInventoryPanel(); break;
    case 'adventure': renderAdventurePanel(); break;
    case 'combat': renderCombatPanel(); break;
    case 'achieve': renderAchievementsPanel(); break;
    case 'world': renderWorldPanel(); break;
    case 'guild': renderGuildPanel(); break;
    case 'trade': renderTradePanel(); break;
    case 'breed': renderBreedPanel(); break;
    case 'leaders': renderLeadersPanel(); break;
    case 'daily': renderDailyPanel(); break;
    case 'seasonal': renderSeasonalPanel(); break;
    case 'minigame': renderMiniGamePanel(); break;
    case 'settings': renderSettingsPanel(); break;
    case 'story': renderStoryPanel(); break;
  }
}

function modalContent(panelName) {
  const el = document.getElementById('modal-' + panelName + '-content');
  return el;
}

// Feed Panel
function renderFeedPanel() {
  const el = modalContent('feed');
  const pet = getActivePet();
  if (!pet) { el.innerHTML = '<p>No pet selected!</p>'; return; }
  let html = '<h2>\uD83C\uDF60 Feed ' + pet.name + '</h2>';
  html += '<div class="tab-row">';
  for (const [key, item] of Object.entries(ITEMS)) {
    if (item.type === 'food') {
      html += '<div class="item-slot" onclick="useItem(\''+key+'\');renderFeedPanel()" title="'+item.desc+'\nCost: '+item.price+' coins">';
      html += '<div style="font-size:20px">'+item.icon+'</div>';
      html += '<div style="font-size:8px">'+item.name+'</div>';
      html += '</div>';
    }
  }
  html += '</div>';
  html += '<h3>Food in Inventory</h3><div class="tab-row">';
  let hasFood = false;
  GS.inventory.forEach(iv => {
    const item = ITEMS[iv.key];
    if (item && item.type === 'food') {
      hasFood = true;
      html += '<div class="item-slot" onclick="useItem(\''+iv.key+'\');renderFeedPanel();updatePetUI()">';
      html += '<div style="font-size:20px">'+item.icon+'</div>';
      html += '<div style="font-size:8px">'+item.name+'</div>';
      html += '<div class="qty">x'+iv.qty+'</div>';
      html += '</div>';
    }
  });
  if (!hasFood) html += '<p style="font-size:10px;color:var(--gray)">No food in inventory. Visit the shop!</p>';
  html += '</div>';
  el.innerHTML = html;
}

// Play Panel
function renderPlayPanel() {
  const el = modalContent('play');
  const pet = getActivePet();
  if (!pet) { el.innerHTML = '<p>No pet selected!</p>'; return; }
  let html = '<h2>\uD83C\uDFBE Play with ' + pet.name + '</h2>';
  html += '<p style="font-size:11px">Playing increases happiness and bond!</p>';
  html += '<button class="btn" onclick="playWithPet(\'fetch\')">\uD83C\uDFBE Play Fetch (-5 energy, +15 happy)</button><br>';
  html += '<button class="btn" onclick="playWithPet(\'cuddle\')">\uD83E\uDD17 Cuddle (-2 energy, +10 happy, +5 bond)</button><br>';
  html += '<button class="btn" onclick="playWithPet(\'chase\')">\uD83C\uDFC3 Chase (-8 energy, +20 happy)</button><br>';
  html += '<button class="btn" onclick="playWithPet(\'tricks\')">\uD83C\uDFAD Do Tricks (-5 energy, +5 happy, +10 bond)</button><br>';
  el.innerHTML = html;
}

function playWithPet(activity) {
  const pet = getActivePet();
  if (!pet) return;
  switch(activity) {
    case 'fetch': pet.energy = Math.max(0, pet.energy - 5); pet.happy = Math.min(100, pet.happy + 15); break;
    case 'cuddle': pet.energy = Math.max(0, pet.energy - 2); pet.happy = Math.min(100, pet.happy + 10); pet.bond += 5; break;
    case 'chase': pet.energy = Math.max(0, pet.energy - 8); pet.happy = Math.min(100, pet.happy + 20); break;
    case 'tricks': pet.energy = Math.max(0, pet.energy - 5); pet.happy = Math.min(100, pet.happy + 5); pet.bond += 10; break;
  }
  pet.xp = (pet.xp || 0) + 2;
  SFX.blip();
  notify(pet.name + ' played ' + activity + '!');
  updatePetUI();
  updateQuestProgress('plays');
  checkLevelUp(pet);
}

// Train Panel
function renderTrainPanel() {
  const el = modalContent('train');
  const pet = getActivePet();
  if (!pet) { el.innerHTML = '<p>No pet selected!</p>'; return; }
  let html = '<h2>\uD83C\uDFCB Train ' + pet.name + '</h2>';
  if (GS.trainingSession) {
    const pct = Math.floor(GS.trainingSession.progress / GS.trainingSession.duration * 100);
    html += '<p>Training in progress: ' + GS.trainingSession.type + ' (' + pct + '%)</p>';
    html += '<div class="stat-bar"><div class="stat-fill" style="width:'+pct+'%;background:var(--gold)"></div></div>';
  } else {
    html += '<p style="font-size:11px">Costs 10 energy per session. Improves pet stats!</p>';
    html += '<button class="btn" onclick="startTraining(\'attack\')">\u2694 Attack Training</button><br>';
    html += '<button class="btn" onclick="startTraining(\'defense\')">\uD83D\uDEE1 Defense Training</button><br>';
    html += '<button class="btn" onclick="startTraining(\'speed\')">\u26A1 Speed Training</button><br>';
    html += '<button class="btn" onclick="startTraining(\'balanced\')">\uD83D\uDD2E Balanced Training</button><br>';
  }
  el.innerHTML = html;
}

// Garden Panel
function renderGardenPanel() {
  const el = modalContent('garden');
  let html = '<h2>\uD83C\uDF3F Garden</h2>';
  // Plant seeds
  html += '<div class="tab-row">';
  for (const [key, plant] of Object.entries(GARDEN_PLANTS)) {
    html += '<div class="item-slot" onclick="plantSeed(\''+key+'\',-1)" title="'+plant.name+'">';
    html += '<div style="font-size:20px">'+plant.icon+'</div>';
    html += '<div style="font-size:8px">'+plant.name+'</div>';
    html += '</div>';
  }
  html += '</div>';
  // Garden plots
  html += '<h3>Plots</h3><div class="tab-row">';
  if (GS.gardenPlots.length === 0) html += '<p style="font-size:10px;color:var(--gray)">Empty garden. Plant some seeds!</p>';
  for (let i = 0; i < 6; i++) {
    if (i >= GS.gardenPlots.length) {
      html += '<div class="item-slot" style="border-style:dashed"><div style="font-size:14px">\uD83C\uDF31</div><div style="font-size:8px">Empty</div></div>';
      continue;
    }
    const plot = GS.gardenPlots[i];
    html += '<div class="item-slot">';
    if (plot.plant) {
      const spec = GARDEN_PLANTS[plot.plant.type];
      if (plot.plant.ready) {
        html += '<div style="font-size:20px;cursor:pointer" onclick="harvestPlot('+i+');renderGardenPanel()">' + spec.icon + '</div>';
        html += '<div style="font-size:8px;color:var(--green)">READY!</div>';
      } else {
        html += '<div style="font-size:16px">\uD83C\uDF31</div>';
        const elapsed = GS.tick - plot.plant.plantTime;
        const growTime = spec.growTime * 60;
        const pct = Math.floor(elapsed / growTime * 100);
        html += '<div class="stat-bar"><div class="stat-fill" style="width:'+pct+'%;background:var(--green)"></div></div>';
        html += '<div style="font-size:8px">' + pct + '%</div>';
        if (!plot.watered) html += '<button class="btn small" onclick="waterPlot('+i+');renderGardenPanel()">\uD83D\uDCA7</button>';
      }
    } else {
      html += '<div style="font-size:14px">\uD83C\uDF31</div><div style="font-size:8px">Empty</div>';
    }
    html += '</div>';
  }
  html += '</div>';
  el.innerHTML = html;
}

// Shop Panel
function renderShopPanel() {
  const el = modalContent('shop');
  let html = '<h2>\uD83D\uDED2 Shop</h2>';
  html += '<div style="display:flex;flex-wrap:wrap;gap:4px">';
  for (const [key, item] of Object.entries(ITEMS)) {
    const count = getItemCount(key);
    html += '<div style="border:1px solid var(--purple);border-radius:4px;padding:6px;width:120px;text-align:center">';
    html += '<div style="font-size:24px">'+item.icon+'</div>';
    html += '<div style="font-size:11px">'+item.name+'</div>';
    html += '<div style="font-size:9px;color:var(--gray)">'+item.desc+'</div>';
    html += '<div style="color:var(--gold);font-size:10px">\u2606 '+item.price+' coins</div>';
    html += '<button class="btn small" onclick="buyItem(\''+key+'\');renderShopPanel()">Buy</button> ';
    if (count > 0) html += '<button class="btn small danger" onclick="sellItem(\''+key+'\');renderShopPanel()">Sell ('+count+')</button>';
    html += '</div>';
  }
  html += '</div>';
  html += '<h3>Special Items</h3>';
  html += '<button class="btn gold" onclick="buyItem(\'mysteryEgg\')">\uD83E\uDD5A Mystery Egg - 1000 coins</button> ';
  html += '<button class="btn gold" onclick="buyItem(\'breedToken\')">\uD83C\uDFF7 Breed Token - 300 coins</button> ';
  html += '<button class="btn gold" onclick="buyItem(\'luckyCoin\')">\uD83D\uDCB0 Lucky Coin - 500 coins</button>';
  el.innerHTML = html;
}

// Inventory Panel
function renderInventoryPanel() {
  const el = modalContent('inventory');
  let html = '<h2>\uD83C\uDF92 Inventory</h2>';
  html += '<div style="display:flex;flex-wrap:wrap;gap:4px">';
  if (GS.inventory.length === 0) html += '<p style="color:var(--gray)">Inventory is empty!</p>';
  GS.inventory.forEach(iv => {
    const item = ITEMS[iv.key];
    if (!item) return;
    html += '<div class="item-slot" style="width:70px;height:70px" onclick="useItem(\''+iv.key+'\');renderInventoryPanel();updatePetUI()">';
    html += '<div style="font-size:24px">'+item.icon+'</div>';
    html += '<div style="font-size:9px">'+item.name+'</div>';
    html += '<div class="qty">x'+iv.qty+'</div>';
    html += '</div>';
  });
  html += '</div>';
  // Equipped items on active pet
  const pet = getActivePet();
  if (pet && pet.equips) {
    html += '<h3>Equiped</h3><div class="tab-row">';
    for (const [slot, itemKey] of Object.entries(pet.equips)) {
      const item = ITEMS[itemKey];
      if (item) {
        html += '<div class="item-slot"><div style="font-size:16px">'+item.icon+'</div><div style="font-size:8px">'+slot+'</div></div>';
      }
    }
    html += '</div>';
  }
  el.innerHTML = html;
}

// Adventure / Combat Panel
function renderAdventurePanel() {
  const el = modalContent('adventure');
  let html = '<h2>\u2694 Adventure</h2>';
  html += '<p style="font-size:11px">Choose a quest or explore a dungeon!</p>';
  html += '<select id="adventure-select" style="width:100%">';
  for (const [key, enemy] of Object.entries(ENEMIES)) {
    const pet = getActivePet();
    const difficulty = pet ? Math.floor(enemy.atk + enemy.def + enemy.hp/10) : 999;
    html += '<option value="'+key+'">'+enemy.icon+' '+enemy.name+' (Lv recomend ~'+difficulty+')</option>';
  }
  html += '</select>';
  html += '<button class="btn gold" onclick="startCombat(document.getElementById(\'adventure-select\').value);renderCombatPanel()">\u2694 Fight!</button>';
  html += '<h3>CYOA Story</h3>';
  html += '<p style="font-size:10px;color:var(--gray)">Explore the narrative world!</p>';
  html += '<button class="btn" onclick="startStory(\'intro\')">\uD83D\uDCD6 Begin Story</button>';
  el.innerHTML = html;
}

// Combat Panel
function renderCombatPanel() {
  const el = modalContent('combat');
  const cs = GS.combatState;
  if (!cs) {
    el.innerHTML = '<h2>\u2694 Combat</h2><p>No active battle. Start one from Adventure!</p>';

// ---- Pet UI Update ----
function updatePetUI() {
  const pet = getActivePet();
  if (!pet) {
    document.getElementById('pet-name-display').textContent = 'No Pet';
    document.getElementById('pet-species').textContent = '-';
    document.getElementById('pet-leve').textContent = '1';
    return;
  }
  const spec = PET_SPECIES[pet.species];
  document.getElementById('pet-name-display').textContent = spec.icon + ' ' + pet.name;
  document.getElementById('pet-leve').textContent = pet.level;
  document.getElementById('pet-species').textContent = spec.name;
  
  document.getElementById('hunger-val').textContent = Math.floor(pet.hunger) + '/100';
  document.getElementById('hunger-fill').style.width = pet.hunger + '%';
  document.getElementById('hunger-fill').style.background = pet.hunger < 25 ? 'var(--red)' : 'var(--orange)';
  
  document.getElementById('happy-val').textContent = Math.floor(pet.happy) + '/100';
  document.getElementById('happy-fill').style.width = pet.happy + '%';
  
  document.getElementById('energy-val').textContent = Math.floor(pet.energy) + '/100';
  document.getElementById('energy-fill').style.width = pet.energy + '%';
  
  document.getElementById('health-val').textContent = Math.floor(pet.health) + '/' + pet.maxHealth;
  const healthPct = pet.health / pet.maxHealth * 100;
  document.getElementById('health-fill').style.width = healthPct + '%';
  document.getElementById('health-fill').style.background = healthPct < 25 ? 'var(--red)' : healthPct < 50 ? 'var(--orange)' : 'var(--green)';
  
  const xpNed = pet.level * 100;
  document.getElementById('xp-val').textContent = Math.floor(pet.xp) + '/' + xpNed;
  document.getElementById('xp-fill').style.width = (pet.xp / xpNed * 100) + '%';
  
  document.getElementById('stat-atk').textContent = pet.atk;
  document.getElementById('stat-def').textContent = pet.def;
  document.getElementById('stat-spd').textContent = pet.spd;
  document.getElementById('stat-bond').textContent = pet.bond;
  document.getElementById('stat-breed').textContent = pet.breedCount || 0;
}

// ---- Initialization ----
function initGame() {
  log('Initializing NetPetz...');
  
  // Init audio
  SFX.init();
  
  // Init Firebase (non-blocking)
  initFirebase();
  
  // Init Pixi
  if (!initPixi()) {
    log('PixiJS failed, using HTML fallback');
  }
  
  // Try loading local save
  if (!loadLocal()) {
    log('No local save found, fresh start');
  }
  
  // Init dailies
  GS.dailyQuests = generateDailyQuests();
  GS.weeklyQuests = generateWeeklyQuests();
  checkSeasonalEvent();
  
  // Update UI
  updateCurrencyDisplay();
  updatePetUI();
  
  // If we have a pet, start immediately
  if (getActivePet()) {
    document.getElementById('login-screen').classList.add('hidden');
    startGameLoop();
  }
  
  // Start render loop
  requestAnimationFrame(renderFrame);
  
  // Add keyboard handler for rhythm game
  document.addEventListener('keydown', function(e) {
    resetAFK();
    if (rhythmState && rhythmState.active) {
      if (e.key === 'a' || e.key === 'A') hitRhythmLane(0);
      if (e.key === 's' || e.key === 'S') hitRhythmLane(1);
      if (e.key === 'd' || e.key === 'D') hitRhythmLane(2);
      if (e.key === 'f' || e.key === 'F') hitRhythmLane(3);
      renderMiniGamePanel();
    }
  });
  
  // Auto-save every 60s
  setInterval(function() {
    saveLocal();
    if (GS.online) saveGame();
  }, 60000);
  
  // Training tick
  setInterval(function() {
    if (GS.trainingSession && GS.trainingSession.active) {
      updateTraining();
      const el = document.getElementById('modal-train-content');
      if (el && document.getElementById('modal-train').classList.contains('active')) {
        renderTrainPanel();
      }
    }
  }, 2000);
  
  // Mini-game update loops
  setInterval(function() {
    if (catchState && catchState.active) updateCatchGame();
    if (rhythmState && rhythmState.active) updateRhythmGame();
  }, 50);
  
  // Garden update
  setInterval(function() {
    updateGarden();
  }, 5000);
  
  log('NetPetz initialized - ready!');
}

// ---- Click handler for modal overlay ----
document.addEventListener('DOMContentLoaded', function() {
  // Close modals when clicking overlay (not content)
  document.querySelectorAll('.modal-overlay').forEach(overlay => {
    overlay.addEventListener('click', function(e) {
      if (e.target === overlay) {
        overlay.classList.remove('active');
        // Clean up mini-games
        memoryState = null;
        catchState = null;
        rhythmState = null;
      }
    });
  });
  
  // Init game
  initGame();
});

// Global click for AFK reset
document.addEventListener('click', function() { resetAFK(); });
document.addEventListener('mousemove', function() { resetAFK(); });
document.addEventListener('keydown', function() { resetAFK(); });

</script>
</body>
</html>
